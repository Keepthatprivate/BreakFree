    <!-- Preload critical fonts - only what's needed for first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Load fonts with display=swap for faster text rendering -->

    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
    </noscript>
    <!-- Inline critical CSS for instant first paint (LCP optimization) -->
    <style>
      /* Critical resets */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { background-color: #0d0d16; min-height: 100vh; margin: 0; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }

      /* Critical IntroScene styles */
      .intro-shell { position: relative; width: 100%; height: 100vh; overflow: hidden; background-color: #0d0d16; }
      .intro-shell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.9); }
      .intro-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent, transparent); pointer-events: none; }

      /* Critical LandingPage styles */
      .landing-container { min-height: 100vh; background-color: #0d0d16; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
      .landing-btn { width: 100%; max-width: 400px; background-color: #54d3bb; color: white; border: none; border-radius: 9999px; padding: 14px 42px; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: all 250ms ease; }
      .landing-btn:hover { transform: translateY(-2px) scale(1.03); background-color: #6ee7b7; }

      /* Loading spinner */
      @keyframes spin { to { transform: rotate(360deg); } }
      .loading-spinner { width: 2rem; height: 2rem; border: 2px solid #54d3bb; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    </style>
    <script>
      (function() {
        var urlParams = new URLSearchParams(window.location.search);
        var fbclid = urlParams.get('fbclid');
        
        // Always create/refresh fbc when fbclid is in URL (new ad click)
        if (fbclid) {
          var timestamp = Date.now();
          var fbcValue = 'fb.1.' + timestamp + '.' + fbclid;
          var expiryDate = new Date();
          expiryDate.setDate(expiryDate.getDate() + 90);
          document.cookie = '_fbc=' + fbcValue + '; expires=' + expiryDate.toUTCString() + '; path=/; SameSite=Lax';
          try { 
            localStorage.setItem('fb_fbc', fbcValue); 
            localStorage.setItem('fb_click_id', fbclid);
            localStorage.setItem('fb_fbc_timestamp', timestamp.toString());
          } catch(e) {}
        } else {
          // No fbclid in URL - validate existing fbc is not stale (>7 days old)
          try {
            var existingFbc = localStorage.getItem('fb_fbc');
            if (existingFbc) {
              var parts = existingFbc.split('.');
              if (parts.length >= 3) {
                var fbcTimestamp = parseInt(parts[2], 10);
                var sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
                // If fbc is older than 7 days and no new fbclid, clear it
                // This prevents sending stale attribution data
                if (Date.now() - fbcTimestamp > sevenDaysMs) {
                  localStorage.removeItem('fb_fbc');
                  localStorage.removeItem('fb_click_id');
                  document.cookie = '_fbc=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                }
              }
            }
          } catch(e) {}
        }
        
        // Create fbp if it doesn't exist
        if (!document.cookie.includes('_fbp=')) {
          var ts = Date.now();
          var rand = Math.floor(Math.random() * 2147483647);
          var fbpValue = 'fb.1.' + ts + '.' + rand;
          var exp = new Date();
          exp.setDate(exp.getDate() + 90);
          document.cookie = '_fbp=' + fbpValue + '; expires=' + exp.toUTCString() + '; path=/; SameSite=Lax';
          try { localStorage.setItem('fb_fbp', fbpValue); } catch(e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
